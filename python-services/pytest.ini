[pytest]
asyncio_mode = auto
testpaths = tax-scraper/tests insurance-edi/tests shared/tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Three services each ship a `tests` package, so the default (prepend) import
# mode collides on `tests.test_*`; importlib mode gives each a unique name.
# `pythonpath` replaces the sys.path entries prepend mode used to add as a side
# effect (`shared.*` from here, `src.*` from tax-scraper/).
# test_hometax_crawl.py is a manual script that drives a real browser against
# hometax.go.kr (needs `playwright install` and the internet); run it directly.
# The coverage floor is the measured level when the suite first ran in CI
# (43%, 2026-10-04); the old 80% was never enforced. Raise it, never lower it.
pythonpath = . tax-scraper
addopts = -v --import-mode=importlib --ignore=tax-scraper/tests/test_hometax_crawl.py --cov=. --cov-report=html --cov-report=term-missing --cov-fail-under=40
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests
