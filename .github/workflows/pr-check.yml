# K-ERP Pull Request Check
# Runs on all pull requests to main and develop
#
# Third-party actions are pinned to a commit SHA. A mutable ref (@master,
# @main, @v1) means "whatever that repository contains at the moment the job
# runs", which hands the runner - and its GITHUB_TOKEN - to whoever can push
# there.

name: PR Check

on:
  pull_request:
    branches: [main, develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  # ============================================
  # PR Info & Labels
  # ============================================
  pr-info:
    name: PR Info
    runs-on: ubuntu-latest

    steps:
      # PR titles are attacker-controlled. They are passed through `env:` and
      # referenced as "$TITLE" so the shell never parses their contents.
      # Interpolating ${{ github.event.pull_request.title }} directly into a
      # run block is a command-injection sink.
      - name: PR Information
        env:
          NUMBER: ${{ github.event.pull_request.number }}
          TITLE: ${{ github.event.pull_request.title }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail
          printf 'PR #%s\n' "$NUMBER"
          printf 'Title: %s\n' "$TITLE"
          printf 'From: %s\n' "$HEAD_REF"
          printf 'To: %s\n' "$BASE_REF"

      - name: Check PR title format
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          if [[ ! "$TITLE" =~ ^(feat|fix|docs|style|refactor|test|chore|perf|ci|build|revert)(\(.+\))?:\ .+ ]]; then
            echo "Warning: PR title doesn't follow conventional commit format"
            echo "Expected: type(scope): description"
            echo "Examples: feat(api): add user authentication"
            echo "          fix(db): resolve connection pool issue"
          fi

  # ============================================
  # Code Quality Checks
  # ============================================
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Check Go formatting
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not formatted:"
            echo "$unformatted"
            echo ""
            echo "Run 'gofmt -w .' to fix"
            exit 1
          fi

      # No `|| true`. `go vet` catches real bugs; a gate that cannot fail is
      # not a gate.
      - name: Run go vet
        run: go vet ./...

      - name: Check for TODOs and FIXMEs
        run: |
          set -uo pipefail
          echo "=== TODOs found ==="
          grep -rn "TODO" --include="*.go" --include="*.ts" --include="*.tsx" . || echo "None"
          echo ""
          echo "=== FIXMEs found ==="
          grep -rn "FIXME" --include="*.go" --include="*.ts" --include="*.tsx" . || echo "None"
          exit 0

  # ============================================
  # Security Scan
  # ============================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # aquasecurity/trivy-action v0.36.0
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: 'fs'
          scan-ref: '.'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
          format: 'table'

      # The previous implementation excluded `*.example` files
      # (`grep -v "\.example"`). That is exactly where deployment credentials
      # get pasted, and it is why the production SSH password in
      # docs/.env_ssh.example was never flagged. The scanner below reads
      # `.example` files like any other and decides on the VALUE instead.
      - name: Prove the secret scanner still detects known secret shapes
        run: python3 scripts/scan-secrets.py --self-test

      - name: Check for secrets
        run: python3 scripts/scan-secrets.py

      # Second opinion with a purpose-built tool (entropy + provider-specific
      # rules). Pinned by digest; allowlist lives in .gitleaks.toml.
      - name: gitleaks
        run: |
          set -euo pipefail
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/repo:ro" -w /repo \
            zricethezav/gitleaks@sha256:75bdb2b2f4db213cde0b8295f13a88d6b333091bbfbf3012a4e083d00d31caba \
            detect --no-git --redact --no-banner \
            --config /repo/.gitleaks.toml --exit-code 1

  # ============================================
  # Build Test
  # ============================================
  build-test:
    name: Build Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      # `|| echo "build skipped"` turned a compile failure into a green check.
      - name: Build API
        run: go build -o /dev/null ./cmd/api

      - name: Build Worker
        run: go build -o /dev/null ./cmd/worker

  # ============================================
  # Test Summary
  # ============================================
  test-summary:
    name: Test Summary
    runs-on: ubuntu-latest
    needs: [pr-info, code-quality, security-scan, build-test]
    if: always()

    steps:
      - name: Summary
        env:
          PR_INFO: ${{ needs.pr-info.result }}
          CODE_QUALITY: ${{ needs.code-quality.result }}
          SECURITY: ${{ needs.security-scan.result }}
          BUILD: ${{ needs.build-test.result }}
        run: |
          set -euo pipefail
          {
            echo "## PR Check Summary"
            echo ""
            echo "| Check | Status |"
            echo "|-------|--------|"
            echo "| PR Info | ${PR_INFO} |"
            echo "| Code Quality | ${CODE_QUALITY} |"
            echo "| Security Scan | ${SECURITY} |"
            echo "| Build Test | ${BUILD} |"
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for r in "$PR_INFO" "$CODE_QUALITY" "$SECURITY" "$BUILD"; do
            case "$r" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done
          if [ "$failed" -ne 0 ]; then
            echo "One or more PR checks failed."
            exit 1
          fi
