# K-ERP CI Pipeline
# Runs on: push to any branch, pull requests to main/develop
#
# Policy: a failing check MUST turn the pipeline red.
# `|| true` and `continue-on-error: true` are forbidden on anything that
# verifies the code. They are allowed only on steps that publish artefacts or
# coverage to a third-party service, where an outage there must not fail the
# build. Every such use is annotated below.

name: CI Pipeline

on:
  push:
    branches: [main, develop, 'phase/**', 'feature/**', 'release/**', 'fix/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

env:
  GO_VERSION: '1.22'
  NODE_VERSION: '20'
  PYTHON_VERSION: '3.11'

jobs:
  # ============================================
  # Go Backend - Lint, Test, Build
  # ============================================
  backend:
    name: Go Backend
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kerp_test
          POSTGRES_PASSWORD: kerp_test_password
          POSTGRES_DB: kerp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          cache-dependency-path: go.sum

      - name: Download dependencies
        run: go mod download

      - name: go vet
        run: go vet ./...

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.61.0
          args: --timeout=5m

      - name: Run unit tests
        env:
          DATABASE_URL: postgres://kerp_test:kerp_test_password@localhost:5432/kerp_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          APP_ENV: test
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Run security tests
        env:
          DATABASE_URL: postgres://kerp_test:kerp_test_password@localhost:5432/kerp_test?sslmode=disable
          REDIS_URL: redis://localhost:6379
          APP_ENV: test
        run: go test -tags=security ./tests/security/...

      # Non-gating: uploading to a third-party service must not fail the build.
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage.out
          flags: backend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Build binaries
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/api ./cmd/api
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/worker ./cmd/worker

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: go-binaries
          path: bin/
          retention-days: 7

  # ============================================
  # Python Services - Lint, Test
  # ============================================
  python-services:
    name: Python Services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          # There is no aggregate python-services/requirements.txt; each service
          # ships its own. Install all of them plus the shared test deps.
          pip install -r python-services/requirements-test.txt
          for req in python-services/*/requirements.txt; do
            echo "Installing $req"
            pip install -r "$req"
          done

      # ruff (not flake8) is the linter declared in requirements-test.txt and
      # in each service's pyproject.toml.
      - name: Lint - syntax errors and undefined names (gating)
        run: ruff check python-services/ --select E9,F63,F7,F82 --output-format=full

      - name: Lint - full report (non-gating, exit code ignored on purpose)
        run: ruff check python-services/ --statistics --exit-zero

      # The old step looked for python-services/tests (which does not exist) and
      # therefore never ran a single test. pytest.ini already points testpaths
      # at tax-scraper/tests, insurance-edi/tests and shared/tests.
      - name: Run tests
        working-directory: python-services
        run: pytest --cov=. --cov-report=xml

      - name: Upload python coverage
        uses: codecov/codecov-action@v4
        with:
          files: python-services/coverage.xml
          flags: python
          fail_ci_if_error: false
        continue-on-error: true

  # ============================================
  # Frontend - Lint, Test, Build
  # ============================================
  frontend:
    name: Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Run ESLint
        working-directory: web
        run: npm run lint

      - name: Run type check
        working-directory: web
        run: npm run typecheck

      - name: Run unit tests with coverage
        working-directory: web
        run: npm run test:coverage

      # Non-gating: third-party upload.
      - name: Upload frontend coverage
        uses: codecov/codecov-action@v4
        with:
          files: web/coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false
        continue-on-error: true

      - name: Build
        working-directory: web
        run: npm run build

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: web/dist/
          retention-days: 7

  # ============================================
  # E2E Tests (Playwright)
  # ============================================
  e2e-tests:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [frontend]
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        working-directory: web
        run: npx playwright test --project=chromium
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: web/playwright-report/
          retention-days: 7

  # ============================================
  # Docker Build Test
  # ============================================
  docker-build:
    name: Docker Build Test
    runs-on: ubuntu-latest
    needs: [backend]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/docker/Dockerfile.api
          push: false
          tags: kerp-api:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Worker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/docker/Dockerfile.worker
          push: false
          tags: kerp-worker:test

      - name: Build Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deployments/docker/Dockerfile.web
          push: false
          tags: kerp-web:test

      # Regression guard for the tax-scraper Dockerfile, whose COPY paths were
      # service-relative while compose builds it from the repository root.
      - name: Build Tax Scraper image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./python-services/tax-scraper/Dockerfile
          target: production
          push: false
          tags: kerp-tax-scraper:test

      - name: Build Insurance EDI image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./python-services/insurance-edi/Dockerfile
          target: production
          push: false
          tags: kerp-insurance-edi:test

  # ============================================
  # Deployment configuration validation
  # ============================================
  compose-validate:
    name: Compose Config
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Placeholder values only - this job proves the files interpolate, it
      # never touches a real environment.
      - name: Validate production compose renders
        working-directory: deployments/docker
        env:
          DB_PASSWORD: ci-placeholder-not-a-secret-0000000000
          JWT_SECRET: ci-placeholder-not-a-secret-0000000000
          MINIO_ROOT_USER: kerp_admin
          MINIO_PASSWORD: ci-placeholder-not-a-secret-0000000000
          MEILI_KEY: ci-placeholder-not-a-secret-0000000000
          GRAFANA_USER: admin
          GRAFANA_PASSWORD: ci-placeholder-not-a-secret-0000000000
          ARIA_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f
        run: |
          set -euo pipefail
          docker compose -f docker-compose.yml config -q
          docker compose -f docker-compose.yml -f docker-compose.dev.yml config -q

      # F-17 regression guard. The frontend is built with VITE_API_URL=/api/v1
      # and the Go router registers engine.Group("/api").Group("/v1"), so every
      # proxy hop must preserve the /api prefix. A deleted nginx.conf used to
      # strip it (`proxy_pass http://api_backend/`), and an unused
      # `strip-api-prefix` middleware sat in the Traefik config inviting the
      # same mistake. Neither may come back.
      - name: API prefix must be preserved by every proxy hop
        run: |
          set -euo pipefail
          rc=0

          # Match real YAML keys, not the explanatory comments about them.
          if grep -rnE '^[[:space:]]*stripPrefix[[:space:]]*:' deployments/docker/traefik/; then
            echo "FAIL: a stripPrefix middleware exists in the Traefik config."
            echo "      The backend serves /api/v1/*; stripping /api yields 404."
            rc=1
          else
            echo "OK: no stripPrefix directive in the Traefik config"
          fi

          if grep -rnE '^[[:space:]]*proxy_pass[[:space:]]' deployments/docker/nginx/ 2>/dev/null; then
            echo "FAIL: nginx now proxies the API. There must be exactly one"
            echo "      reverse proxy in front of the API (Traefik), and a"
            echo "      trailing slash on proxy_pass silently strips /api."
            rc=1
          else
            echo "OK: the web image's nginx serves static files only"
          fi

          python3 - <<'PYEOF'
          import sys, yaml
          routes = yaml.safe_load(open('deployments/docker/traefik/dynamic/routes.yml'))
          api = routes['http']['routers']['api-router']
          assert 'websecure' in api['entryPoints'], api['entryPoints']
          assert not any('strip' in m for m in api.get('middlewares', [])), api['middlewares']
          print("OK: api-router terminates on websecure with no strip middleware")
          PYEOF

          exit $rc

      # Each of these must FAIL to render. If a guard is ever weakened back to
      # `${VAR:-default}`, this step catches it.
      - name: Required secrets must fail closed
        working-directory: deployments/docker
        env:
          DB_PASSWORD: ci-placeholder-not-a-secret-0000000000
          JWT_SECRET: ci-placeholder-not-a-secret-0000000000
          MINIO_ROOT_USER: kerp_admin
          MINIO_PASSWORD: ci-placeholder-not-a-secret-0000000000
          MEILI_KEY: ci-placeholder-not-a-secret-0000000000
          GRAFANA_USER: admin
          GRAFANA_PASSWORD: ci-placeholder-not-a-secret-0000000000
          ARIA_ENCRYPTION_KEY: 000102030405060708090a0b0c0d0e0f
        run: |
          set -uo pipefail
          rc=0
          for var in JWT_SECRET DB_PASSWORD ARIA_ENCRYPTION_KEY MINIO_PASSWORD MEILI_KEY GRAFANA_PASSWORD; do
            if env -u "$var" docker compose -f docker-compose.yml config -q 2>/dev/null; then
              echo "FAIL: compose still renders with $var unset"
              rc=1
            else
              echo "OK: compose refuses to render without $var"
            fi
          done
          exit $rc

  # ============================================
  # CI Status Summary
  # ============================================
  ci-status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [backend, python-services, frontend, docker-build, compose-validate]
    if: always()

    steps:
      - name: Check results
        env:
          BACKEND: ${{ needs.backend.result }}
          PYTHON: ${{ needs.python-services.result }}
          FRONTEND: ${{ needs.frontend.result }}
          DOCKER: ${{ needs.docker-build.result }}
          COMPOSE: ${{ needs.compose-validate.result }}
        run: |
          set -euo pipefail
          echo "==================================="
          echo "CI Pipeline Results"
          echo "==================================="
          printf 'Backend:   %s\n' "$BACKEND"
          printf 'Python:    %s\n' "$PYTHON"
          printf 'Frontend:  %s\n' "$FRONTEND"
          printf 'Docker:    %s\n' "$DOCKER"
          printf 'Compose:   %s\n' "$COMPOSE"
          echo "==================================="

          failed=0
          for result in "$BACKEND" "$PYTHON" "$FRONTEND" "$DOCKER" "$COMPOSE"; do
            case "$result" in
              success|skipped) ;;
              *) failed=1 ;;
            esac
          done

          if [ "$failed" -ne 0 ]; then
            echo "CI failed - at least one job did not succeed."
            exit 1
          fi

          echo "CI checks completed successfully!"
