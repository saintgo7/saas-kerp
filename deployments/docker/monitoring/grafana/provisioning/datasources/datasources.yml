# Grafana Datasources
# K-ERP SaaS Monitoring

apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: "15s"

  - name: PostgreSQL
    type: postgres
    url: postgres:5432
    database: kerp
    user: kerp
    secureJsonData:
      # Grafana provisioning expands $VAR / ${VAR} but NOT ${VAR:-default}.
      # DB_PASSWORD is passed to the grafana service in docker-compose.yml.
      password: $DB_PASSWORD
    jsonData:
      sslmode: disable
      maxOpenConns: 5
      maxIdleConns: 2
      connMaxLifetime: 14400
    editable: false
