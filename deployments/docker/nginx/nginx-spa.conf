# Static SPA server for the built React bundle.
#
# This is the ONLY nginx configuration in use (Dockerfile.web copies it to
# /etc/nginx/conf.d/default.conf). TLS termination, rate limiting, CORS and
# HSTS live in Traefik (deployments/docker/traefik/), not here.
#
# nginx drops every inherited `add_header` as soon as a nested block declares
# one of its own, so the security headers are repeated in each location that
# adds a header. Removing a repetition silently removes the headers from that
# path.

server {
    listen 3000;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Uploads are proxied to the API, not to this server, but keep the limit
    # explicit rather than relying on nginx's 1m default.
    client_max_body_size 20m;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    # Security headers (server level - inherited only by blocks that add none)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        # `expires` is not used here: it emits its own Cache-Control, which
        # would be sent alongside the explicit one below as a duplicate header.
        # Repeated headers below because any add_header in this block discards
        # every server-level add_header for this location.
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA routing - serve index.html for all routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Health check endpoint
    location /health {
        access_log off;
        default_type text/plain;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        return 200 "healthy";
    }
}
