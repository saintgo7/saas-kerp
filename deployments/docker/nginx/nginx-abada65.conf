# kerp.abada.co.kr (abada-65): SPA + API on one hostname, no Traefik.
#
# Mounted over /etc/nginx/conf.d/default.conf by docker-compose.abada65.yml.
# Path: Cloudflare -> cloudflared (host) -> 127.0.0.1:10252 -> this server
#       -> api:8080 for /api/ and /health*.
# The SPA calls the relative /api/v1, so no CORS round trip is needed.
#
# Client IP: Cloudflare appends the visitor to X-Forwarded-For; this server
# appends its own peer. The api trusts only private networks
# (KERP_APP_TRUSTED_PROXIES), so gin walks the list from the right and stops at
# the first public address - the visitor - and a forged left-most entry is ignored.
#
# Security headers are repeated wherever a block adds a header of its own
# (nginx drops inherited add_header in that case).

server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript application/json;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Docker's embedded DNS, re-resolved so a recreated api container (new IP)
    # does not leave nginx pointing at the old address.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $kerp_api http://api:8080;

    location ^~ /api/ {
        proxy_pass $kerp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_read_timeout 120s;
    }

    location ^~ /health {
        proxy_pass $kerp_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log off;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
