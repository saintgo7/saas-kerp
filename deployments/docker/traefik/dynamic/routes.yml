# Traefik Dynamic Configuration - Routes
# Service routing configuration
#
# All routers terminate on `websecure` (:443). The `web` (:80) entry point does
# nothing but answer the ACME HTTP-01 challenge and redirect to HTTPS
# (see traefik.yml). Keeping a router on `web` would re-open a plaintext path
# for credentials and JWTs.
#
# `security-headers` (HSTS, nosniff, frameDeny, ...) is attached to the
# websecure entry point itself in traefik.yml, so every router below inherits
# it without repeating the middleware.

http:
  routers:
    # API Router
    api-router:
      rule: "Host(`erp.abada.kr`) && PathPrefix(`/api`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - rate-limit-api
        - compress
        - cors-headers
      service: api-service

    # Login Router (stricter rate limit)
    login-router:
      rule: "Host(`erp.abada.kr`) && Path(`/api/v1/auth/login`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - rate-limit-login
        - cors-headers
      service: api-service
      priority: 100

    # WebSocket Router
    websocket-router:
      rule: "Host(`erp.abada.kr`) && PathPrefix(`/ws`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: api-service

    # Frontend Router
    frontend-router:
      rule: "Host(`erp.abada.kr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - rate-limit-general
        - compress
        - security-headers
      service: frontend-service
      priority: 1

    # Traefik Dashboard (internal only)
    dashboard-router:
      rule: "Host(`traefik.erp.abada.kr`) || (Host(`erp.abada.kr`) && PathPrefix(`/traefik`))"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - internal-only
        - dashboard-auth
      service: api@internal

    # Prometheus (internal only)
    prometheus-router:
      rule: "Host(`prometheus.erp.abada.kr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - internal-only
        - dashboard-auth
      service: prometheus-service

    # Grafana (internal only)
    grafana-router:
      rule: "Host(`grafana.erp.abada.kr`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      middlewares:
        - internal-only
      service: grafana-service

    # Health Check (no auth)
    health-router:
      rule: "Host(`erp.abada.kr`) && Path(`/health`)"
      entryPoints:
        - websecure
      tls:
        certResolver: letsencrypt
      service: api-service

  services:
    api-service:
      loadBalancer:
        servers:
          - url: "http://kerp-api:8080"
        healthCheck:
          path: /health
          interval: 10s
          timeout: 3s

    frontend-service:
      loadBalancer:
        servers:
          - url: "http://kerp-web:3000"
        healthCheck:
          path: /health
          interval: 30s
          timeout: 5s

    prometheus-service:
      loadBalancer:
        servers:
          - url: "http://kerp-prometheus:9090"

    grafana-service:
      loadBalancer:
        servers:
          - url: "http://kerp-grafana:3000"
