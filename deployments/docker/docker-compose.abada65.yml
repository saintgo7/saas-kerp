# abada-65 override: https://kerp.abada.co.kr (Cloudflare tunnel -> 127.0.0.1:10252)
#
#   cd deployments/docker
#   docker-compose -p kerp -f docker-compose.yml -f docker-compose.abada65.yml config -q
#   docker-compose -p kerp -f docker-compose.yml -f docker-compose.abada65.yml up -d
#
# Runs only postgres, redis, nats, api and web. Everything else is moved to the
# "disabled" profile, so a plain `up -d` never starts it (Traefik would try to
# bind 0.0.0.0:80/443, which other services on this host already use).
# The ${VAR:?} guards in the base file are still evaluated for disabled
# services, so .env must define all nine of them; see docs/claude/06_배포_설정.md 4절.
#
# Only loopback ports are published: 10252 = web (the tunnel origin, which also
# proxies /api and /health to the api), 10253 = api for local checks.

name: kerp

services:
  api:
    image: kerp-api:${KERP_IMAGE_TAG:-local}
    environment:
      KERP_APP_ENV: production
      GIN_MODE: release
      KERP_CORS_ALLOWED_ORIGINS: https://kerp.abada.co.kr
      # Only the docker bridge networks sit between cloudflared and the api;
      # see nginx/nginx-abada65.conf for how the visitor IP is recovered.
      KERP_APP_TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
    ports: !override
      - "127.0.0.1:10253:8080"
    restart: unless-stopped

  web:
    image: kerp-web:${KERP_IMAGE_TAG:-local}
    ports: !override
      - "127.0.0.1:10252:3000"
    volumes:
      - ./nginx/nginx-abada65.conf:/etc/nginx/conf.d/default.conf:ro
    # /health is now proxied to the api; check nginx itself instead.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  postgres:
    restart: unless-stopped
  redis:
    restart: unless-stopped
  nats:
    restart: unless-stopped

  traefik:
    profiles: [disabled]
    ports: !reset []
  minio:
    profiles: [disabled]
    ports: !reset []
  worker:
    profiles: [disabled]
  meilisearch:
    profiles: [disabled]
  tax-scraper:
    profiles: [disabled]
  insurance-edi:
    profiles: [disabled]
  prometheus:
    profiles: [disabled]
  alertmanager:
    profiles: [disabled]
  grafana:
    profiles: [disabled]
  node-exporter:
    profiles: [disabled]
  postgres-exporter:
    profiles: [disabled]
  redis-exporter:
    profiles: [disabled]
