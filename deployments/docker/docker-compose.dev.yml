# K-ERP SaaS Docker Compose - Development Override
# Usage: make dev-up
#    or: docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d
#
# Every host port below is bound to 127.0.0.1 on purpose. Without an explicit
# interface Docker binds 0.0.0.0, which put the Delve debugger (remote code
# execution, no auth) and the database on any network the laptop joins.

services:
  # =============================================================================
  # Go API Server (Development)
  # =============================================================================
  api:
    build:
      target: development
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:2345:2345"  # Delve debugger - loopback only
    environment:
      - KERP_APP_ENV=development
      - APP_ENV=development
      - GIN_MODE=debug
    volumes:
      - ../../:/app
      - go-mod-cache:/go/pkg/mod
    command: ["air", "-c", ".air.toml"]

  # =============================================================================
  # Background Worker (Development)
  # =============================================================================
  worker:
    build:
      target: development
    environment:
      - KERP_APP_ENV=development
      - APP_ENV=development
    volumes:
      - ../../:/app
      - go-mod-cache:/go/pkg/mod

  # =============================================================================
  # Tax Scraper (Development)
  # =============================================================================
  tax-scraper:
    ports:
      - "127.0.0.1:50051:50051"
    environment:
      - DEBUG=true
      - LOG_LEVEL=debug
    volumes:
      - ../../python-services/tax-scraper:/app
      - ../../python-services/shared:/app/shared

  # =============================================================================
  # Insurance EDI (Development)
  # =============================================================================
  insurance-edi:
    ports:
      - "127.0.0.1:50052:50052"
    environment:
      - DEBUG=true
      - LOG_LEVEL=debug
    volumes:
      - ../../python-services/insurance-edi:/app
      - ../../python-services/shared:/app/shared

  # =============================================================================
  # PostgreSQL (Development)
  # =============================================================================
  postgres:
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      # Demo company + demo admin account. DEV ONLY - never mounted by the
      # staging/production stack.
      - ./init-db.dev.sql:/docker-entrypoint-initdb.d/20-dev-seed.sql:ro

  # =============================================================================
  # Redis (Development)
  # =============================================================================
  redis:
    ports:
      - "127.0.0.1:6379:6379"

  # =============================================================================
  # NATS (Development)
  # =============================================================================
  nats:
    ports:
      - "127.0.0.1:4222:4222"
      - "127.0.0.1:8222:8222"

  # =============================================================================
  # Web frontend (Development)
  # =============================================================================
  #
  # This container serves the PRODUCTION static bundle and does not proxy /api
  # (deployments/docker/nginx/nginx-spa.conf is a static-file server only), so
  # http://127.0.0.1:3000/api/v1/... falls through to the SPA and returns
  # index.html rather than reaching the API.
  #
  # For day-to-day frontend work run `npm run dev` instead: web/vite.config.ts
  # proxies /api to http://localhost:8080 WITHOUT rewriting the path, matching
  # what Traefik does in staging/production. Reach this container through
  # Traefik (https://erp.abada.kr) when you need the built bundle.
  web:
    ports:
      - "127.0.0.1:3000:3000"

  # NOTE: there is no `nginx` service in docker-compose.yml. The override block
  # that used to sit here declared neither `image` nor `build`, which makes the
  # merged configuration invalid. Removed.

  # =============================================================================
  # Adminer (Database GUI)
  # =============================================================================
  adminer:
    image: adminer:4.8.1
    container_name: kerp-adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:8080"
    networks:
      - kerp-network

  # =============================================================================
  # Mailhog (Email Testing)
  # =============================================================================
  mailhog:
    image: mailhog/mailhog:v1.0.1
    container_name: kerp-mailhog
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - kerp-network

volumes:
  go-mod-cache:
